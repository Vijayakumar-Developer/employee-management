<div>
  <div class="toolbar">
    <button (click)="addNew()">Add Employee</button>
  </div>

  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <table *ngIf="!loading && employees.length > 0" class="employee-table">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Email</th><th>Salary</th><th>Actions</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of employees">
        <td>{{ e.id }}</td>
        <td>{{ e.firstName }} {{ e.lastName }}</td>
        <td>{{ e.email }}</td>
        <td>{{ e.salary | number:'1.0-2' }}</td>
        <td>
          <button (click)="editEmployee(e.id)">Edit</button>
          <button (click)="deleteEmployee(e.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && employees.length === 0">
    No employees found.
  </div>
</div>
