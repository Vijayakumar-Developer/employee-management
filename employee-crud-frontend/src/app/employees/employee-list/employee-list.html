<div class="page-container">
  <h1>Employee Management</h1>

  <button class="btn primary" (click)="addEmployee()">➕ Add Employee</button>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Salary</th>
          <th style="width: 150px;">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let e of employees">
          <td>{{ e.id }}</td>
          <td>{{ e.firstName }} {{ e.lastName }}</td>
          <td>{{ e.email }}</td>
          <td>{{ e.salary | number }}</td>
          <td class="actions">
            <button class="btn edit" (click)="editEmployee(e.id)">Edit</button>
            <button class="btn delete" (click)="deleteEmployee(e.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
